plugins {
    id 'fabric-loom' version '1.6-SNAPSHOT'
    id 'maven-publish'
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'Minecraft'
        url = 'https://libraries.minecraft.net/'
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.26.40'
    mappings 'net.fabricmc:yarn:1.26.40+build.1:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.15.11'
}

loom {
    minecraftVersion = '1.26.40'
    run {
        version = 'client'
        propertyMap {
            property 'fabric.dli.config.enabled', 'true'
        }
    }
}
